[tool.uv.workspace]
members = [
  "source/isaaclab_extension",
  # RL training repos cloned into source/ (see launch.sh's source/ mount) get
  # added here so `uv sync` installs them into the shared /workspace/.venv:
  # "source/unitree_rl_lab",
]

[tool.uv]
required-environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'"
]
exclude-dependencies = ["pywin32"]
# Isaac Lab 3.0 is a beta release (isaaclab==3.0.0b2.post1) that pulls in
# other pre-release pins (e.g. tinyobjloader==2.0.0rc13); NVIDIA's own install
# docs require both of these flags for the same reason.
prerelease = "allow"
index-strategy = "unsafe-best-match"

[tool.uv.extra-build-dependencies]
isaacsim-kernel = ["wheel-stub"]
flatdict = ["setuptools<82", "wheel"]


